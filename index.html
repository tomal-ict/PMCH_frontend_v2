<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no" />
    <title>Popular Medical College Hospital</title>
    <meta name="keywords" content="Popular Medical College Hospital, PMCH" />
    <meta name="description" content="Popular Medical College Hospital - An advanced Center for medical services" />
    <meta name="author" content="Popular Medical College Hospital" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="/pmch/img/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/pmch/img/apple-touch-icon.png" />

    <!-- Web Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800%7CShadows+Into+Light" rel="stylesheet" type="text/css" />

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="/pmch/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/pmch/vendor/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="/pmch/vendor/animate/animate.min.css" />
    <link rel="stylesheet" href="/pmch/vendor/simple-line-icons/css/simple-line-icons.min.css" />

    <!-- Theme CSS -->
    <link rel="stylesheet" href="/pmch/css/theme.css" />
    <link rel="stylesheet" href="/pmch/css/theme-elements.css" />
    <link rel="stylesheet" href="/pmch/css/theme-blog.css" />
    <link rel="stylesheet" href="/pmch/css/theme-shop.css" />
    <link rel="stylesheet" href="/pmch/css/skins/default.css" />
    <link rel="stylesheet" href="/pmch/css/custom.css" />

    <style>
      #header .header-nav-top .nav > li > a, #header .header-nav-top .nav > li > span {
        color: #fff;
      }
      #header .header-nav-top .nav > li + .nav-item-left-border {
        border-left: 1px solid white;
      }
      .social-icons li a {
        border-radius: 0%;
        color: #fff !important;
      }
      @media (min-width: 992px){
        #header .header-nav-main.header-nav-main-square nav > ul > li.dropdown-mega .dropdown-mega-sub-nav > li > a {
          border-bottom: 1px solid #ecebeb;
        }
        #header .header-nav.header-nav-line nav > ul > li > a {
          padding: 0 8px;
        }
      }
      .page-header {
        background-color: #17a2b8;
        padding: 30px 0;
        margin-bottom: 35px;
        color: #fff;
      }
      .page-header h1 {
        color: #fff;
        font-size: 26px;
        margin: 0;
      }
      .breadcrumb {
        background: transparent;
        padding: 0;
        margin: 0;
      }
      .breadcrumb a {
        color: #e0e0e0;
      }
      .dropdown-link:hover, .hover-bg-light:hover {
        background-color: #f0f7fb !important;
        color: #0088cc !important;
        transform: translateX(3px);
      }
      .hover-text-primary:hover {
        color: #0088cc !important;
        text-decoration: none;
      }
      .hover-text-primary:hover i {
        color: #0088cc !important;
      }
      .dropdown-item:hover {
        background-color: #f0f7fb !important;
        color: #0088cc !important;
      }

      /* ========================================================
         1. Hide right vertical scrollbar globally across browsers
         ======================================================== */
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      html,
      body {
        -ms-overflow-style: none !important; /* IE & Edge */
        scrollbar-width: none !important; /* Firefox */
        overflow-y: scroll; /* Keep scrolling smoothly enabled */
      }

      /* ========================================================
         2. Corporate Partners Infinite Marquee Animation (Right to Left)
         ======================================================== */
      @keyframes marqueeScrollLeft {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .marquee-container {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
      }
      .marquee-track {
        display: flex;
        width: max-content;
        animation: marqueeScrollLeft 28s linear infinite;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }

      /* Hover elevate effect */
      .hover-elevate:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.12) !important;
      }

      /* ========================================================
         Hero Banner Text Floating & Subtle Pulse Animation
         ======================================================== */
      @keyframes heroTextFloat {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      .hero-text-wrap {
        animation: heroTextFloat 5.5s ease-in-out infinite;
      }

      /* ========================================================
         Social Media Buttons for Footer & Header
         ======================================================== */
      .social-icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #ffffff !important;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: all 0.28s ease;
        text-decoration: none !important;
      }
      .social-icon-btn:hover {
        background: #00984A !important;
        border-color: #00984A !important;
        color: #ffffff !important;
        transform: translateY(-3px);
        box-shadow: 0 6px 18px rgba(0, 152, 74, 0.45);
      }
      .hover-opacity:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
