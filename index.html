<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no" />
    <title>Popular Medical College Hospital</title>
    <meta name="keywords" content="Popular Medical College Hospital, PMCH" />
    <meta name="description" content="Popular Medical College Hospital - An advanced Center for medical services" />
    <meta name="author" content="Popular Medical College Hospital" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="/pmch/img/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/pmch/img/apple-touch-icon.png" />

    <!-- Web Fonts - Exact match with populardiagnostic.com (Poppins & Ubuntu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="/pmch/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/pmch/vendor/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="/pmch/vendor/animate/animate.min.css" />
    <link rel="stylesheet" href="/pmch/vendor/simple-line-icons/css/simple-line-icons.min.css" />

    <!-- Theme CSS with Cache Busting -->
    <link rel="stylesheet" href="/pmch/css/theme.css?v=2.1" />
    <link rel="stylesheet" href="/pmch/css/theme-elements.css?v=2.1" />
    <link rel="stylesheet" href="/pmch/css/theme-blog.css?v=2.1" />
    <link rel="stylesheet" href="/pmch/css/theme-shop.css?v=2.1" />
    <link rel="stylesheet" href="/pmch/css/skins/default.css?v=2.1" />
    <link rel="stylesheet" href="/pmch/css/custom.css?v=2.1" />

    <style>
      /* Exact Typography matching https://www.populardiagnostic.com/ */
      html {
        font-size: 16px !important;
        overflow-x: clip !important;
      }
      body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        font-size: 16px !important;
        line-height: 1.625 !important;
        color: #4b5563 !important;
        background-color: #ffffff;
        overflow-x: clip !important;
      }
      p:not(#footer p):not(.footer-copyright p), .card-text, .entry-content, .lead-sm {
        font-family: 'Ubuntu', 'Poppins', sans-serif !important;
        font-size: 16px !important;
        line-height: 1.625 !important;
        color: #4b5563 !important;
      }
      #footer, #footer p, #footer span, #footer strong, #footer div, #footer a:not(.btn):not(.badge), .footer-copyright, .footer-copyright p, .footer-copyright span {
        color: #ffffff !important;
      }
      #footer .footer-contact-info, #footer .footer-contact-info span, #footer .footer-contact-info p, #footer .footer-contact-info div {
        font-size: 17px !important;
        line-height: 1.85 !important;
        color: #ffffff !important;
      }
      #footer .footer-contact-info strong {
        font-weight: 700 !important;
        color: #ffffff !important;
      }
      #footer .footer-contact-info a {
        color: #ffffff !important;
        text-decoration: none !important;
      }
      #footer .footer-contact-info a:hover {
        color: #e2e8f0 !important;
        text-decoration: underline !important;
      }
      .footer-copyright p, .footer-copyright .copyright-text {
        font-size: 15.5px !important;
        color: #ffffff !important;
      }
      .footer-views-counter, #footer .footer-views-counter {
        background: transparent !important;
        color: #ffffff !important;
        font-size: 15.5px !important;
      }
      .footer-views-counter span, .footer-views-counter i {
        color: #ffffff !important;
      }
      h1, .h1, h2, .h2, h3, .h3, h4, .h4, h5, .h5, h6, .h6 {
        font-family: 'Ubuntu', sans-serif !important;
        font-weight: 700 !important;
        color: #1f2937 !important;
      }
      #header .nav-link, .main-sticky-navbar .nav-link {
        font-family: 'Ubuntu', sans-serif !important;
        font-size: 14px !important;
        font-weight: 700 !important;
        letter-spacing: 0.025em !important;
        color: #374151 !important;
      }
      #header .nav-link:hover, .main-sticky-navbar .nav-link:hover {
        color: #006642 !important;
      }
      #header.main-sticky-navbar, header#header {
        position: -webkit-sticky !important;
        position: sticky !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        z-index: 9999 !important;
        background-color: #ffffff !important;
      }
      .pmch-header-logo {
        height: auto;
        width: auto;
        object-fit: contain;
        display: block;
        transition: all 0.25s ease-in-out;
      }
      @media (min-width: 1200px) {
        .pmch-header-logo {
          max-height: 64px !important;
          max-width: 330px !important;
        }
      }
      @media (min-width: 992px) and (max-width: 1199.98px) {
        .pmch-header-logo {
          max-height: 48px !important;
          max-width: 250px !important;
        }
      }
      @media (min-width: 768px) and (max-width: 991.98px) {
        .pmch-header-logo {
          max-height: 52px !important;
          max-width: 270px !important;
        }
      }
      @media (min-width: 576px) and (max-width: 767.98px) {
        .pmch-header-logo {
          max-height: 46px !important;
          max-width: 235px !important;
        }
      }
      @media (max-width: 575.98px) {
        .pmch-header-logo {
          max-height: 42px !important;
          max-width: 205px !important;
        }
      }
      @media (max-width: 379.98px) {
        .pmch-header-logo {
          max-height: 36px !important;
          max-width: 175px !important;
        }
      }
      #header .header-nav-top .nav > li > a, #header .header-nav-top .nav > li > span {
        color: #fff;
      }
      #header .header-nav-top .nav > li + .nav-item-left-border {
        border-left: 1px solid white;
      }
      .social-icons li a {
        border-radius: 0%;
        color: #fff !important;
      }
      @media (min-width: 992px){
        #header .header-nav-main.header-nav-main-square nav > ul > li.dropdown-mega .dropdown-mega-sub-nav > li > a {
          border-bottom: 1px solid #ecebeb;
        }
        #header .header-nav.header-nav-line nav > ul > li > a {
          padding: 0 8px;
        }
      }
      .page-header {
        background-color: #17a2b8;
        padding: 30px 0;
        margin-bottom: 35px;
        color: #fff;
      }
      .page-header h1 {
        color: #fff;
        font-size: 26px;
        margin: 0;
      }
      .breadcrumb {
        background: transparent;
        padding: 0;
        margin: 0;
      }
      .breadcrumb a {
        color: #e0e0e0;
      }
      .dropdown-link:hover, .hover-bg-light:hover {
        background-color: #f0f7fb !important;
        color: #0088cc !important;
        transform: translateX(3px);
      }
      .hover-text-primary:hover {
        color: #0088cc !important;
        text-decoration: none;
      }
      .hover-text-primary:hover i {
        color: #0088cc !important;
      }
      .dropdown-item:hover {
        background-color: #f0f7fb !important;
        color: #0088cc !important;
      }

      /* ========================================================
         1. Hide right vertical scrollbar globally across browsers
         ======================================================== */
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      html,
      body {
        -ms-overflow-style: none !important; /* IE & Edge */
        scrollbar-width: none !important; /* Firefox */
      }

      /* ========================================================
         2. Corporate Partners Infinite Marquee Animation (Right to Left)
         ======================================================== */
      @keyframes marqueeScrollLeft {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .marquee-container {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
      }
      .marquee-track {
        display: flex;
        width: max-content;
        animation: marqueeScrollLeft 28s linear infinite;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }

      /* Hover elevate effect */
      .hover-elevate:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.12) !important;
      }

      /* ========================================================
         Hero Banner Text Floating & Subtle Pulse Animation
         ======================================================== */
      @keyframes heroTextFloat {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      .hero-text-wrap {
        animation: heroTextFloat 5.5s ease-in-out infinite;
      }

      /* ========================================================
         Social Media Buttons for Footer & Header
         ======================================================== */
      .social-icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #ffffff !important;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: all 0.28s ease;
        text-decoration: none !important;
      }
      .social-icon-btn:hover {
        background: #00984A !important;
        border-color: #00984A !important;
        color: #ffffff !important;
        transform: translateY(-3px);
        box-shadow: 0 6px 18px rgba(0, 152, 74, 0.45);
      }
      .hover-opacity:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
